services:

  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: esg_oracle_db
    environment:
      - ORACLE_PASSWORD=fiap123
      - APP_USER=esg_user
      - APP_USER_PASSWORD=esg_pass
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - esg-network

  esg-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: esg_spring_api
    ports:
      - "8080:8080"
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521/xepdb1
      - SPRING_DATASOURCE_USERNAME=esg_user
      - SPRING_DATASOURCE_PASSWORD=esg_pass
    networks:
      - esg-network

volumes:
  oracle-data:

networks:
  esg-network:
    driver: bridge