name: CI

on:
  pull_request:
  push:
    branches:
      - '*'

jobs:
  Tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test
        run: mvn clean test

  Deploy:
    runs-on: ubuntu-latest
    needs: Tests

    if: success()

    steps:
      - name: Deploy application
        run: |
          echo "Deploying application..."
